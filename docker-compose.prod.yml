version: '3.8'

services:
  # 1. Nginx (The Entry Point)
  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - ecoride-network

  # 2. Backend Server
  server:
    build: 
      context: ./server
    container_name: ecoride-server
    restart: always
    environment:
      # It will read the Atlas URL from your .env file
      MONGODB_URI: ${MONGODB_URI}
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ecoride-network

  # 3. Frontend Client
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ecoride-client
    restart: always
    networks:
      - ecoride-network

networks:
  ecoride-network:
    driver: bridge