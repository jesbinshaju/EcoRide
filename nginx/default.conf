upstream client {
    server client:5173;
}

upstream api {
    server server:5000;
}

server {
    listen 80;

    # Route requests to Frontend
    location / {
        proxy_pass http://client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Route requests to Backend API
    location /api {
        # This trims '/api' off the request before sending to server
        rewrite /api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}